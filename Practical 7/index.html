<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>📝Today’s Checklist</h1>

        <p class="subtitle">
            Add, edit and delete your daily tasks
        </p>


        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button id="addBtn">
                + Add Task
            </button>

        </div>


        <div class="list-header">

            <span>My Tasks</span>

            <span id="taskCount">
                0 Tasks
            </span>

        </div>


        <ul id="taskList"></ul>


        <div id="emptyMessage">

            <div class="check-icon">
                ✓
            </div>

            <h3>No tasks added</h3>

            <p>
                Add your first task to get started.
            </p>

        </div>


        <div class="student">
            Nayan Awalapane | 24070521010
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>

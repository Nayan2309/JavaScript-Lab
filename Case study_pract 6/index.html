<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>String Operations</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>🔤 String Operations</h1>

        <p class="subtitle">
            Reverse a String & Count Vowels
        </p>


        <div class="section">

            <h2>🔄 Reverse a String</h2>

            <input
                type="text"
                id="stringInput"
                placeholder="Enter a string"
            >

            <button onclick="reverseString()">
                Reverse String
            </button>

            <div id="reverseResult"></div>

        </div>


        <div class="section">

            <h2>🔤 Count Vowels</h2>

            <textarea
                id="paragraphInput"
                placeholder="Enter a paragraph..."
            ></textarea>

            <button onclick="countVowels()">
                Count Vowels
            </button>

            <div id="vowelResult"></div>

        </div>


        <div class="student">

            Nayan Awalapane | PRN: 24070521010

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
